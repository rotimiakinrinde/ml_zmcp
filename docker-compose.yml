version: '3.8'

services:
  attrition-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attrition-prediction-api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    networks:
      - attrition-network

networks:
  attrition-network:
    driver: bridge
